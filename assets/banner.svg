<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#ec4899;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#38bdf8;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#38bdf8;#a855f7;#f43f5e" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Scan Line Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="14" />

  <!-- Grid Perspective Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
  </g>

  <!-- Ambient Dynamic Pulsing AI Network Nodes (Flanking Sides) -->
  <g fill="none" opacity="0.65">
    <!-- Left Visual Mesh -->
    <path d="M 80,120 L 190,70 L 260,170 L 140,240 Z" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="4s" repeatCount="indefinite" />
    </path>
    <circle cx="80" cy="120" r="6" fill="#38bdf8">
      <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="190" cy="70" r="7" fill="#818cf8">
      <animate attributeName="r" values="6;9;6" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="170" r="5" fill="#a855f7" />
    <circle cx="140" cy="240" r="6" fill="#10b981">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Right Visual Mesh -->
    <path d="M 940,90 L 1090,140 L 1020,270 L 890,210 Z" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="4s" repeatCount="indefinite" />
    </path>
    <circle cx="940" cy="90" r="6" fill="#ec4899" />
    <circle cx="1090" cy="140" r="8" fill="#f43f5e">
      <animate attributeName="r" values="6;10;6" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="270" r="6" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="890" cy="210" r="5" fill="#a855f7" />
  </g>

  <!-- Simulated Object Detection Bounding Box on Edge -->
  <g>
    <rect x="70" y="270" width="110" height="90" stroke="#10b981" stroke-width="1.5" fill="none" rx="4" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,400;400,0" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="70" y="255" width="60" height="15" fill="#10b981" opacity="0.8" rx="2" />
    <text x="75" y="266" fill="#041f14" font-family="monospace" font-size="10" font-weight="700">OBJ 98%</text>
  </g>

  <g>
    <rect x="1010" y="280" width="120" height="80" stroke="#38bdf8" stroke-width="1.5" fill="none" rx="4" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="400,0;0,400" dur="5s" repeatCount="indefinite" />
    </rect>
    <rect x="1010" y="265" width="75" height="15" fill="#38bdf8" opacity="0.8" rx="2" />
    <text x="1015" y="276" fill="#041829" font-family="monospace" font-size="10" font-weight="700">TRACK 99%</text>
  </g>

  <!-- Dynamic Laser Scanning Line across the Canvas -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#scan-grad)" stroke-width="2.5" opacity="0.7">
    <animate attributeName="y" values="0;420;0" dur="8s" repeatCount="indefinite" />
  </line>

  <!-- Central Title Pill (Protected Foreground Backdrop) -->
  <rect x="230" y="100" width="740" height="210" rx="20" fill="#0b1120" fill-opacity="0.82" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />

  <!-- Top Category Tag -->
  <rect x="490" y="125" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="600" y="143" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1.5">
    👁️ COMPUTER VISION CURATED
  </text>

  <!-- Main Title -->
  <text x="600" y="195" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="url(#text-grad)" letter-spacing="1.5">
    AWESOME COMPUTER VISION
  </text>

  <!-- Subtitle -->
  <text x="600" y="240" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="17" fill="#cbd5e1" letter-spacing="2.5">
    ARCHITECTURES • FOUNDATION MODELS • BENCHMARKS
  </text>

  <!-- Bottom Interactive Tags / Pills -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
    <rect x="300" y="270" width="110" height="24" rx="12" fill="#1e293b" />
    <text x="355" y="286" text-anchor="middle">⚡ Deep Learning</text>

    <rect x="430" y="270" width="105" height="24" rx="12" fill="#1e293b" />
    <text x="482" y="286" text-anchor="middle">🎯 Vision Transformers</text>

    <rect x="555" y="270" width="105" height="24" rx="12" fill="#1e293b" />
    <text x="607" y="286" text-anchor="middle">📦 Object Detection</text>

    <rect x="680" y="270" width="100" height="24" rx="12" fill="#1e293b" />
    <text x="730" y="286" text-anchor="middle">🧠 Multimodal AI</text>

    <rect x="800" y="270" width="95" height="24" rx="12" fill="#1e293b" />
    <text x="847" y="286" text-anchor="middle">🚀 Production CV</text>
  </g>
</svg>
