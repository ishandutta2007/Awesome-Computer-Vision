<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.08); }
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -40;
        }
      }
      .node {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .node-slow {
        animation: pulse 6s ease-in-out infinite;
        transform-origin: center;
      }
      .connection {
        stroke-dasharray: 8, 4;
        animation: dash 2s linear infinite;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid-grad)" />

  <!-- Animated Tech Grid/Network -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Laser Scanline -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.5">
    <animate attributeName="y" values="0;400;0" dur="10s" repeatCount="indefinite" />
  </line>

  <!-- Network Nodes -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none">
    <line x1="200" y1="100" x2="400" y2="250" class="connection" />
    <line x1="400" y1="250" x2="300" y2="300" class="connection" />
    <line x1="300" y1="300" x2="150" y2="250" class="connection" />
    <line x1="1000" y1="100" x2="850" y2="200" class="connection" />
    <line x1="850" y1="200" x2="950" y2="320" class="connection" stroke="#ec4899" />
  </g>

  <circle cx="200" cy="100" r="12" fill="#38bdf8" class="node" />
  <circle cx="400" cy="250" r="18" fill="#a855f7" class="node-slow" />
  <circle cx="300" cy="300" r="10" fill="#ec4899" class="node" />
  <circle cx="150" cy="250" r="8" fill="#10b981" class="node-slow" />
  <circle cx="1000" cy="100" r="14" fill="#eab308" class="node" />
  <circle cx="850" cy="200" r="16" fill="#3b82f6" class="node-slow" />
  <circle cx="950" cy="320" r="20" fill="#f43f5e" class="node" />

  <!-- Bounding Boxes representing Object Detection -->
  <rect x="180" y="80" width="40" height="40" stroke="#10b981" stroke-width="1.5" fill="none" rx="4">
    <animate attributeName="stroke-dasharray" values="0,160;160,0" dur="4s" repeatCount="indefinite" />
  </rect>
  <rect x="820" y="170" width="60" height="60" stroke="#f43f5e" stroke-width="1.5" fill="none" rx="4">
    <animate attributeName="stroke-dasharray" values="0,240;240,0" dur="5s" repeatCount="indefinite" />
  </rect>

  <!-- Typography -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="url(#text-grad)" letter-spacing="2">
    AWESOME COMPUTER VISION
  </text>
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="4">
    HISTORY • EVOLUTION • MODERN PARADIGMS
  </text>
</svg>
